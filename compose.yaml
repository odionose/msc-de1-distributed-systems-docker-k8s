services:
  flask-app:
    build:
      context: .
    image: msc-de1-flask-app:1.0.2
    container_name: msc-de1-flask-compose
    ports:
      - "5001:5000"
    environment:
      PORT: "5000"

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    read_only: true

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=3)"
        ]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3